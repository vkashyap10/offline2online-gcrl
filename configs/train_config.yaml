project_name: o2o_gcrl # Name of project for wandb logs.
experiment_name: default # Group for wandb logs
job_name: seed0 # Name of job for wandb logs
log_wandb: False

env_name: arm_binpick_easy_EEF
dataset_name: arm_binpick_easy_EEF_goal_thresh_0.01 # <dataset_folder>/<dataset_name>.npz
dataset_folder: ./offline2online_gcrl/data_generation/data/
max_offline_transitions: 20000 # Use only the first N transitions of the dataset. null uses all.
restore_checkpoint: null # offline_checkpoint.pkl from an earlier run: skip the offline phase and fine-tune from it.

seed: 0
goal_conditioning: 1
episode_length: 201
action_repeat: 1
num_envs: 25
num_eval_envs: 20

# The agent is chosen on the command line: --agent=offline2online_gcrl/impls/agents/<agent>.py
# The same agent is trained offline and then fine-tuned online.

unroll_length: 201
seed_steps: 5000
offline_train_steps: 500000 # 10 offline epochs. 0 still runs one epoch; use restore_checkpoint to skip.
online_train_steps: 500000 # 10 online epochs. 0 skips the online phase (offline-only run).
num_training_iterations_per_epoch: 10
num_training_steps_per_iteration: 52 # ~1 gradient update per collected transition at batch size 100.
online_replay_buffer_size: 100000
action_sample_temperature: 0.1
insert_only_successful_episodes: False
offline_data_ratio: 0.0 # Fraction of each online-phase batch drawn from the offline buffer.

eval_interval: 1
save_interval: 1000
visualization_interval: 0 # Render an HTML rollout every N epochs. 0 disables rendering.
save_dir: ./offline2online_gcrl/impls/exp/
